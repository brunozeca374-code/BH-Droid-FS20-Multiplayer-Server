# fly.toml — BH Droid FS20 Multiplayer Server em Sao Paulo (gru)
app = "bh-droid-fs20-relay-gru"
primary_region = "gru"

[build]

[env]
  PORT = "10000"
  ROOM_ONLINE_TTL_MS = "100000"

[http_service]
  internal_port = 10000
  force_https = true
  auto_stop_machines = false
  auto_start_machines = true
  min_machines_running = 1

  [http_service.concurrency]
    type = "connections"
    hard_limit = 200
    soft_limit = 150

  [[http_service.checks]]
    interval = "30s"
    timeout = "5s"
    grace_period = "10s"
    method = "GET"
    path = "/health"

[[vm]]
  size = "shared-cpu-1x"
  memory = "256mb"
